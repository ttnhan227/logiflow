name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Test and package
        working-directory: server
        run: chmod +x mvnw && ./mvnw -B verify

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Audit production dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Build
        working-directory: client
        run: npm run build

  mobile:
    name: Flutter analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: client_mobile
        run: flutter pub get
      - name: Analyze
        working-directory: client_mobile
        run: flutter analyze
      - name: Test
        working-directory: client_mobile
        run: flutter test
      - name: Build web application
        working-directory: client_mobile
        run: flutter build web --release --dart-define=API_BASE_URL=/api

  end-to-end:
    name: Full-stack end-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-database-password
      JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
      APP_SEED_ENABLED: "true"
      VITE_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Start application stack
        run: docker compose up -d --build --wait database backend frontend
      - name: Install browser test dependencies
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: client
        run: npm test
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  containers:
    name: Container build (${{ matrix.service }})
    needs: [backend, frontend, mobile, end-to-end]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [server, client, client_mobile]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
