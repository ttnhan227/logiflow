<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <linearGradient id="lfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#141e3c"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    <linearGradient id="lfAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="lfGlow" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a1128" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lfGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
      <circle cx="28" cy="28" r="0.75" fill="#334155" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="220" rx="14" fill="url(#lfBg)"/>
  <rect width="800" height="220" rx="14" fill="url(#lfGlow)"/>
  <rect width="800" height="220" rx="14" fill="url(#lfGrid)"/>
  <rect width="798" height="218" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <g transform="translate(55, 45)">
    <rect width="130" height="130" rx="24" fill="#0f1a36" stroke="#334155" stroke-width="1.5"/>
    <rect width="130" height="130" rx="24" fill="none" stroke="url(#lfAccent)" stroke-width="1.5" stroke-opacity="0.4"/>

    <g transform="translate(65, 65)">
      <!-- Hexagonal Fleet Navigation Hub -->
      <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="#132347" stroke="url(#lfAccent)" stroke-width="2.2" stroke-linejoin="round"/>
      
      <!-- Waypoint GPS Vectors & Network Nodes -->
      <circle cx="0" cy="0" r="16" fill="#0d1b38" stroke="#38bdf8" stroke-width="1.8"/>
      
      <!-- Flow Arrows -->
      <path d="M -22 -12 L 0 -24 L 22 -12" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 22 12 L 0 24 L -22 12" fill="none" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Center GPS Radar Dot -->
      <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>

      <!-- Satellite Telemetry Dots -->
      <circle cx="-22" cy="-12" r="3.5" fill="#f97316"/>
      <circle cx="22" cy="-12" r="3.5" fill="#38bdf8"/>
      <circle cx="22" cy="12" r="3.5" fill="#22c55e"/>
      <circle cx="-22" cy="12" r="3.5" fill="#f59e0b"/>
    </g>
  </g>

  <g transform="translate(215, 58)">
    <g transform="translate(0, 0)">
      <rect width="144" height="20" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="3" fill="#f59e0b"/>
      <text x="18" y="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fed7aa" letter-spacing="0.5">LOGISTICS OPERATIONS</text>
    </g>

    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      LOGIFLOW
    </text>

    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Enterprise Freight Dispatch &amp; Real-Time GPS Telemetry Platform
    </text>

    <g transform="translate(0, 94)">
      <rect x="0" y="0" width="118" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#f59e0b"/>
      <text x="22" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Spring Boot 3</text>

      <rect x="128" y="0" width="138" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="140" cy="12" r="3" fill="#06b6d4"/>
      <text x="150" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">STOMP WebSockets</text>

      <rect x="276" y="0" width="124" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="288" cy="12" r="3" fill="#22c55e"/>
      <text x="298" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Leaflet GIS Radar</text>

      <rect x="410" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="422" cy="12" r="3" fill="#f97316"/>
      <text x="432" y="15.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Flutter Mobile</text>
    </g>
  </g>
</svg>