<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="100%" height="150" role="img" aria-label="LogiFlow — Freight Dispatch &amp; Real-Time GPS Tracking">
  <defs>
    <style>
      .wordmark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 800; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-weight: 500; }
      .tag { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Minimal Dark Slate Surface -->
  <rect width="820" height="150" rx="10" fill="#0F172A"/>
  <rect x="0.75" y="0.75" width="818.5" height="148.5" rx="9.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Top Accent Line -->
  <rect x="0" y="0" width="820" height="3" rx="1.5" fill="#FF5500"/>

  <!-- Minimal Geometric Route & Freight Mark (Centered Group) -->
  <g transform="translate(278, 42)">
    <rect width="38" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <path d="M9 24h14l4-5h2v5h2v-6.5l-3.5-3.5H23V12H9v12zm3 3.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm14 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="#FF5500"/>
  </g>

  <!-- Wordmark -->
  <text x="330" y="69" class="wordmark" font-size="30" letter-spacing="2">
    <tspan fill="#F8FAFC">LOGI</tspan><tspan fill="#FF5500">FLOW</tspan>
  </text>

  <!-- Honest, Concise Subtitle -->
  <text x="410" y="106" text-anchor="middle" class="subtitle" font-size="14" fill="#94A3B8">
    Multi-Role Freight Dispatch, Route Mapping &amp; Real-Time GPS Tracking
  </text>

  <!-- Stack Summary Tag -->
  <text x="410" y="128" text-anchor="middle" class="tag" font-size="10.5" fill="#64748B" letter-spacing="0.8">
    SPRING BOOT · REACT · FLUTTER · POSTGRESQL · STOMP WEBSOCKETS
  </text>
