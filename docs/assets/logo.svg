<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Minimalist pure vector logo mark (Works on dark & light surfaces) -->
  <rect width="120" height="120" rx="14" fill="#0B0F17"/>
  
  <!-- Geometric Flowmark: Interlocking Linehaul Corridor Chevrons -->
  <g transform="translate(18, 22)">
    <!-- Rear Corridor Block (Stark White) -->
    <path d="M 0 38 L 26 12 L 52 12 L 26 38 L 52 64 L 26 64 Z" fill="#F8FAFC"/>
    
    <!-- Forward Velocity Arrow (International Freight Orange) -->
    <path d="M 34 38 L 60 12 L 86 38 L 60 64 L 34 64 L 60 38 Z" fill="#FF5500"/>
  </g>
</svg>
