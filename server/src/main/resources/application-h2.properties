# H2 Standalone In-Memory Profile with PostgreSQL compatibility
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:logiflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=KEY,VALUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
