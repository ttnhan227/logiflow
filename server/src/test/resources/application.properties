spring.application.name=server-test

server.port=8080
server.address=0.0.0.0

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:logiflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=KEY,VALUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.version=1.0.0
spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

app.upload.max-size=5242880
app.upload.folder.profile-pictures=logiflow/profile-pictures
app.upload.folder.license-images=logiflow/license-images
app.upload.folder.cv-documents=logiflow/cv-documents
app.upload.folder.business-licenses=logiflow/business-licenses
app.upload.folder.tax-certificates=logiflow/tax-certificates
app.upload.folder.company-logos=logiflow/company-logos

spring.ai.mistralai.api-key=disabled

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=test-password
app.mail.from=onboarding@resend.dev
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

paypal.mode=sandbox
paypal.client.id=test-client-id
paypal.client.secret=test-client-secret
paypal.return.url=http://localhost:8080/api/payment/return
paypal.cancel.url=http://localhost:8080/api/payment/cancel

app.jwt.secret=test-jwt-secret-must-be-at-least-256-bits-long-and-secure!
app.jwt.expiration-ms=36000000
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
