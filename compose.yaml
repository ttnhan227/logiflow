name: logiflow

services:
  database:
    image: postgres:15-alpine
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logiflow}
      POSTGRES_USER: ${POSTGRES_USER:-logiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logiflow-local-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logiflow} -d ${POSTGRES_DB:-logiflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./server
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-logiflow}
      DATABASE_USERNAME: ${POSTGRES_USER:-logiflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-logiflow-local-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deployment}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-36000000}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      THYMELEAF_CACHE: ${THYMELEAF_CACHE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8085}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MISTRAL_AI_API_KEY: ${MISTRAL_AI_API_KEY:-not-configured}
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-resend}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      APP_WEB_BASE_URL: ${APP_WEB_BASE_URL:-http://localhost:5173}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-http://localhost:8080/api/payment/return}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-http://localhost:8080/api/payment/cancel}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mobile:
    build:
      context: ./client_mobile
      args:
        API_BASE_URL: ${MOBILE_API_BASE_URL:-/api}
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${MOBILE_PORT:-8085}:8085"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
